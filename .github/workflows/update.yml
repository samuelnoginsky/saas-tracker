name: update-tracker

on:
  schedule:
    # Weekdays 22:15 UTC: after the US close in both standard and daylight time
    - cron: "15 22 * * 1-5"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build tracker
        run: python update.py

      - name: Commit updated data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update tracker $(date -u +%F)"
          git push
